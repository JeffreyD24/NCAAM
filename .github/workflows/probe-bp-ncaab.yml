name: Probe BettingPros NCAAM props (coverage only)

on:
  push:
    branches: [main]
    paths: [".github/workflows/probe-bp-ncaab.yml", "tools/probe_bp_ncaab.py"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/probe_bp_ncaab.py .
      - name: Save the probe
        run: |
          git config user.name "ncaam-bot"; git config user.email "actions@users.noreply.github.com"
          git add research/probes/bp_ncaab_probe.md
          git commit -q -m "BettingPros NCAAM props probe (coverage only)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q origin main && git push -q origin main && break; sleep 10; done
