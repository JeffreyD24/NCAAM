# One-off check that the NTFY_TOPIC secret works in this repo (Nov 6, 2026, NCAAM live move, plan in
# betting-goals/plans/2026-11-06_NCAAM_LIVE_MOVE.md). Runs when ops/ntfy_test_request.txt changes, or by hand.
# Sends ONE test notification and commits the result to ops/ntfy_test_result.txt. Sends no bet alerts.
name: ntfy test
on:
  workflow_dispatch:
  push:
    paths: ["ops/ntfy_test_request.txt"]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send test notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          now=$(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')
          if [ -z "$NTFY_TOPIC" ]; then
            echo "$now secret NTFY_TOPIC: MISSING in this repo" > ops/ntfy_test_result.txt
          else
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Title: NCAAM repo test" \
              -d "Test from the NCAAM repo ($now). If you see this, the NTFY_TOPIC secret works. No bet." \
              "https://ntfy.sh/$NTFY_TOPIC")
            echo "$now secret NTFY_TOPIC: set (length ${#NTFY_TOPIC}); ntfy HTTP $code" > ops/ntfy_test_result.txt
          fi
          cat ops/ntfy_test_result.txt
      - name: Save result
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add ops/ntfy_test_result.txt && git commit -q -m "ntfy test result" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 5; done
