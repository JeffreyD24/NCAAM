name: NCAAM shadow vs live comparison (daily, live move)

# Nov 6, 2026, NCAAM live move Phase 1. Runs after both daily jobs (nba ncaab.yml and NCAAM ncaab.yml start at 14:17 UTC).
# Rule: ncaab/research/LIVE_MOVE_SHADOW_PASS_RULE_2026-11-06.md. Remove after the cutover week (Phase 3).
on:
  schedule:
    - cron: "47 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pandas
      - name: Compare
        run: python ncaab/shadow_compare.py . | tee -a ncaab/state/shadow_compare_output.txt
      - name: Save
        run: |
          git config user.name "ncaam-bot"; git config user.email "actions@users.noreply.github.com"
          git add ncaab/state/shadow_compare.md ncaab/state/shadow_compare_log.csv ncaab/state/shadow_compare_output.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -q -m "NCAAM shadow compare $(TZ=America/New_York date +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
