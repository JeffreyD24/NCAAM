name: NCAAM line check (SHADOW, sends nothing)

# Nov 6, 2026, NCAAM live move Phase 1 (plan: betting-goals/plans/2026-11-06_NCAAM_LIVE_MOVE.md; pass rule:
# ncaab/research/LIVE_MOVE_SHADOW_PASS_RULE_2026-11-06.md). The live alerts still come from nba-mixed-model alert_loop.sh.
# Do NOT add NTFY_TOPIC here or set NCAAM_SHADOW to "0" until the cutover (Phase 2, Jeffrey present).
on:
  schedule:
    - cron: "*/10 * * * *"     # each run checks every 5 minutes for ~50 minutes; extra starts just queue behind it
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: ncaab-alert-loop
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q pandas numpy
      - name: Check NCAAM lines every 5 minutes (shadow)
        env:
          NCAAM_SHADOW: "1"
          GH_TOKEN: ${{ github.token }}
        run: bash ncaab/alert_loop.sh
